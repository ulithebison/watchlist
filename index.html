<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchlist">
<meta name="theme-color" content="#0d0b14">
<title>Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b14; --bg-soft:#16131f; --card:#1b1726; --card-hi:#231e32;
  --line:#2c2640; --txt:#f3eefe; --txt-dim:#9b93b0; --txt-faint:#6b6480;
  --accent:#e8b14c; --accent-2:#ff5d73;
  --watch:#7b9cff; --watching:#e8b14c; --seen:#5fd09a;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 85% -10%, rgba(232,177,76,.10), transparent 60%),
  radial-gradient(900px 500px at -10% 10%, rgba(255,93,115,.08), transparent 55%),
  var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 18px 40px}

header{margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(34px,9vw,52px);letter-spacing:-.02em;line-height:.95}
.brand h1 em{font-style:italic;color:var(--accent)}
.brand .sub{font-size:13px;color:var(--txt-faint);letter-spacing:.04em;text-transform:uppercase}

.searchbar{position:relative;margin-top:20px}
.searchbar input{width:100%;background:var(--bg-soft);border:1px solid var(--line);border-radius:16px;padding:15px 46px 15px 18px;color:var(--txt);font-family:inherit;font-size:16px;outline:none;transition:border-color .2s,background .2s}
.searchbar input:focus{border-color:var(--accent);background:var(--card)}
.searchbar input::placeholder{color:var(--txt-faint)}
.searchbar .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--txt-faint);pointer-events:none}
.spinner{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

.results{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.result{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;align-items:center;cursor:pointer;transition:background .15s,transform .1s}
.result:active{transform:scale(.99)}
.result:hover{background:var(--card-hi)}
.result img,.result .noimg{width:46px;height:69px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg-soft)}
.result .noimg{display:flex;align-items:center;justify-content:center;color:var(--txt-faint);font-size:20px}
.result .meta{min-width:0;flex:1}
.result .meta .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .meta .d{font-size:13px;color:var(--txt-dim);margin-top:2px}
.result .badge{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--bg-soft);color:var(--txt-dim);flex:none}

/* Controls row */
.controls{display:flex;gap:10px;align-items:center;margin:24px 0 14px;flex-wrap:wrap}
.listsearch{position:relative;flex:1;min-width:160px}
.listsearch input{width:100%;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 34px;color:var(--txt);font-family:inherit;font-size:14px;outline:none}
.listsearch input:focus{border-color:var(--accent)}
.listsearch .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt-faint)}
.sortsel{background:var(--bg-soft);border:1px solid var(--line);color:var(--txt-dim);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:13px;font-weight:600;outline:none;cursor:pointer}

.tabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.tab{background:var(--bg-soft);border:1px solid var(--line);color:var(--txt-dim);padding:8px 15px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.18s;letter-spacing:.01em}
.tab.active{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.tab .count{opacity:.55;margin-left:5px;font-weight:500}

.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;position:relative;box-shadow:var(--shadow);animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.item .poster,.item .noposter{width:74px;height:111px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg-soft)}
.item .noposter{display:flex;align-items:center;justify-content:center;color:var(--txt-faint);font-size:26px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column}
.item .top{display:flex;align-items:flex-start;gap:8px}
.item .title{font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.15;letter-spacing:-.01em}
.item .year{color:var(--txt-dim);font-weight:400}
.item .type{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-faint);margin-top:4px}
.item .overview{font-size:13px;color:var(--txt-dim);line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .overview.full{-webkit-line-clamp:unset;display:block}
.item .genres{font-size:11px;color:var(--txt-faint);margin-top:8px}
.item .rating{display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-size:12px;font-weight:600;margin-left:auto}

.progress{font-size:12px;color:var(--watching);font-weight:600;margin-top:8px}

.statusbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.03em;cursor:pointer;border:1px solid transparent;transition:.15s;user-select:none}
.pill.watchlist{background:rgba(123,156,255,.14);color:var(--watch);border-color:rgba(123,156,255,.3)}
.pill.watching{background:rgba(232,177,76,.14);color:var(--watching);border-color:rgba(232,177,76,.3)}
.pill.seen{background:rgba(95,208,154,.14);color:var(--seen);border-color:rgba(95,208,154,.3)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--txt-dim);cursor:pointer;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;font-family:inherit;transition:.15s}
.iconbtn:hover{border-color:var(--txt-dim);color:var(--txt)}
.del{margin-left:auto;background:none;border:none;color:var(--txt-faint);cursor:pointer;padding:4px;font-size:18px;line-height:1;transition:color .15s}
.del:hover{color:var(--accent-2)}

/* Expandable detail panel */
.panel{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:none}
.panel.open{display:block;animation:fade .25s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-faint);margin:14px 0 7px;font-weight:700}
.panel h4:first-child{margin-top:0}

.note{width:100%;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--txt);font-family:inherit;font-size:13px;outline:none;resize:vertical;min-height:38px}
.note:focus{border-color:var(--accent)}

.providers{display:flex;gap:6px;flex-wrap:wrap}
.prov{display:flex;align-items:center;gap:6px;background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:4px 9px 4px 4px;font-size:12px;color:var(--txt-dim)}
.prov img{width:22px;height:22px;border-radius:5px}
.prov-empty{font-size:12px;color:var(--txt-faint)}
.prov-src{font-size:10px;color:var(--txt-faint);margin-top:6px}

.epfield{display:flex;align-items:center;gap:8px;margin-top:2px}
.epfield input{background:var(--bg-soft);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--txt);font-family:inherit;font-size:13px;outline:none;width:120px}
.epfield input:focus{border-color:var(--accent)}
.epfield label{font-size:12px;color:var(--txt-dim)}

.seasons{display:flex;flex-direction:column;gap:5px}
.season{display:flex;align-items:center;gap:10px;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;transition:.15s}
.season:hover{border-color:var(--txt-dim)}
.season .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--txt-faint);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--bg);transition:.15s}
.season.done .box{background:var(--seen);border-color:var(--seen)}
.season .sname{font-size:13px;font-weight:600}
.season.done .sname{color:var(--txt-dim)}
.season .seps{font-size:11px;color:var(--txt-faint);margin-left:auto}

.empty{text-align:center;padding:60px 20px;color:var(--txt-faint)}
.empty .big{font-family:'Fraunces',serif;font-style:italic;font-size:24px;color:var(--txt-dim);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.6;max-width:340px;margin:0 auto}

.setup{background:var(--card);border:1px solid var(--accent);border-radius:16px;padding:18px;margin-bottom:20px;font-size:14px;line-height:1.6}
.setup b{color:var(--accent)}
.setup code{background:var(--bg);padding:2px 6px;border-radius:5px;font-size:12px;color:var(--accent)}
.setup a{color:var(--watch)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Watch<em>list</em></h1>
      <span class="sub">Filme &amp; Serien</span>
    </div>
    <div class="searchbar">
      <input id="search" type="text" placeholder="Film oder Serie suchen…" autocomplete="off" autocorrect="off">
      <svg class="ic" id="searchIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <div class="spinner" id="spinner"></div>
    </div>
    <div class="results" id="results"></div>
  </header>

  <div id="setupNotice"></div>

  <div class="controls">
    <div class="listsearch">
      <svg class="mag" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="listSearch" type="text" placeholder="In meiner Liste filtern…" autocomplete="off">
    </div>
    <select class="sortsel" id="sortSel">
      <option value="added">Zuletzt hinzugefügt</option>
      <option value="title">Titel A–Z</option>
      <option value="year">Jahr (neueste)</option>
      <option value="rating">Bewertung</option>
    </select>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="all">Alle <span class="count" id="c-all">0</span></button>
    <button class="tab" data-filter="watchlist">Watchlist <span class="count" id="c-watchlist">0</span></button>
    <button class="tab" data-filter="watching">Läuft <span class="count" id="c-watching">0</span></button>
    <button class="tab" data-filter="seen">Gesehen <span class="count" id="c-seen">0</span></button>
    <button class="tab" data-filter="movie">Filme <span class="count" id="c-movie">0</span></button>
    <button class="tab" data-filter="tv">Serien <span class="count" id="c-tv">0</span></button>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
/* ============================================================
   EINRICHTUNG: Trag hier deinen kostenlosen TMDB v3 API-Key ein.
   Key holen: themoviedb.org -> Settings -> API -> "API Key (v3 auth)"
   ============================================================ */
const TMDB_API_KEY = "0004ebc2a5eb0a353176c55630a1aa8c";

const REGION = "DE";              // für Streaming-Anbieter
const IMG = "https://image.tmdb.org/t/p/w185";
const LOGO = "https://image.tmdb.org/t/p/w92";
const STORE_KEY = "watchlist_items_v1";

let items = load();
let activeFilter = "all";
let sortMode = "added";
let listQuery = "";
let searchTimer = null;
const expanded = new Set();       // welche Karten aufgeklappt sind (nur UI)

const $ = id => document.getElementById(id);
const elSearch=$("search"), elResults=$("results"), elList=$("list"),
      elSpinner=$("spinner"), elSearchIcon=$("searchIcon");

function load(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch{return[]} }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(items)); render(); }
function keyMissing(){ return !TMDB_API_KEY || TMDB_API_KEY.includes("HIER_DEINEN"); }
function uid(i){ return i.type+"-"+i.id; }

if(keyMissing()){
  $("setupNotice").innerHTML =
   `<div class="setup"><b>Fast fertig!</b> Trag noch deinen kostenlosen TMDB v3 API-Key in der
    <code>index.html</code> ein (Variable <code>TMDB_API_KEY</code>).<br>
    Key gibt's gratis bei <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org</a>.
    Ohne Key funktioniert die Suche nicht — gespeicherte Einträge bleiben aber erhalten.</div>`;
}

/* ---------- TMDB-Suche ---------- */
elSearch.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = elSearch.value.trim();
  if(!q){ elResults.innerHTML=""; return; }
  if(keyMissing()) return;
  searchTimer = setTimeout(() => doSearch(q), 350);
});

async function doSearch(q){
  toggleSpinner(true);
  try{
    const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=en-US&include_adult=false&query=${encodeURIComponent(q)}`;
    const data = await (await fetch(url)).json();
    const hits = (data.results||[]).filter(r=>r.media_type==="movie"||r.media_type==="tv").slice(0,8);
    renderResults(hits);
  }catch(e){
    elResults.innerHTML = `<div class="result"><div class="meta"><div class="t">Suche fehlgeschlagen</div><div class="d">Internet/Key prüfen</div></div></div>`;
  }finally{ toggleSpinner(false); }
}
function toggleSpinner(on){ elSpinner.style.display=on?"block":"none"; elSearchIcon.style.display=on?"none":"block"; }

function renderResults(hits){
  if(!hits.length){ elResults.innerHTML=`<div class="result"><div class="meta"><div class="t">Keine Treffer</div></div></div>`; return; }
  elResults.innerHTML = hits.map(h=>{
    const title = h.media_type==="movie"?h.title:h.name;
    const year = ((h.media_type==="movie"?h.release_date:h.first_air_date)||"").slice(0,4)||"—";
    const poster = h.poster_path?`<img src="${IMG}${h.poster_path}" alt="">`:`<div class="noimg">🎬</div>`;
    return `<div class="result" data-id="${h.id}" data-type="${h.media_type}">
      ${poster}<div class="meta"><div class="t">${esc(title)}</div><div class="d">${year}</div></div>
      <span class="badge">${h.media_type==="movie"?"Film":"Serie"}</span></div>`;
  }).join("");
  elResults.querySelectorAll(".result[data-id]").forEach(el=>{
    el.addEventListener("click", ()=> addItem(el.dataset.id, el.dataset.type));
  });
}

async function addItem(id, type){
  if(items.some(i=>i.id==id && i.type===type)){ flashClear(); return; }
  toggleSpinner(true);
  try{
    const url = `https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_API_KEY}&language=en-US&append_to_response=watch/providers`;
    const d = await (await fetch(url)).json();

    // Streaming-Anbieter für die Region (flatrate = im Abo enthalten)
    const reg = (d["watch/providers"] && d["watch/providers"].results && d["watch/providers"].results[REGION]) || {};
    const providers = (reg.flatrate||[]).map(p=>({name:p.provider_name, logo:p.logo_path})).slice(0,6);

    // Staffeln (Specials/Staffel 0 raus, außer es bleibt nichts übrig)
    let seasons = [];
    if(type==="tv" && Array.isArray(d.seasons)){
      let s = d.seasons.filter(x=>x.season_number>=1);
      if(!s.length) s = d.seasons;
      seasons = s.map(x=>({n:x.season_number, name:x.name||("Staffel "+x.season_number), episodes:x.episode_count||0, watched:false}));
    }

    const item = {
      id:d.id, type,
      title: type==="movie"?d.title:d.name,
      year: ((type==="movie"?d.release_date:d.first_air_date)||"").slice(0,4),
      poster: d.poster_path||null,
      overview: d.overview||"",
      rating: d.vote_average?d.vote_average.toFixed(1):null,
      genres: (d.genres||[]).map(g=>g.name).slice(0,3),
      status: "watchlist",
      added: Date.now(),
      note: "",
      providers, seasons,
      currentEp: ""
    };
    items.unshift(item);
    expanded.delete(uid(item));
    save();
  }catch(e){ alert("Konnte Details nicht laden."); }
  finally{ toggleSpinner(false); flashClear(); }
}
function flashClear(){ elSearch.value=""; elResults.innerHTML=""; elSearch.blur(); }

/* ---------- Controls ---------- */
$("tabs").addEventListener("click", e=>{
  const t=e.target.closest(".tab"); if(!t) return;
  activeFilter=t.dataset.filter;
  $("tabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
  render();
});
$("sortSel").addEventListener("change", e=>{ sortMode=e.target.value; render(); });
$("listSearch").addEventListener("input", e=>{ listQuery=e.target.value.trim().toLowerCase(); render(); });

function counts(){
  $("c-all").textContent=items.length;
  $("c-watchlist").textContent=items.filter(i=>i.status==="watchlist").length;
  $("c-watching").textContent=items.filter(i=>i.status==="watching").length;
  $("c-seen").textContent=items.filter(i=>i.status==="seen").length;
  $("c-movie").textContent=items.filter(i=>i.type==="movie").length;
  $("c-tv").textContent=items.filter(i=>i.type==="tv").length;
}

function visible(){
  let arr = items.slice();
  switch(activeFilter){
    case "watchlist": arr=arr.filter(i=>i.status==="watchlist"); break;
    case "watching":  arr=arr.filter(i=>i.status==="watching"); break;
    case "seen":      arr=arr.filter(i=>i.status==="seen"); break;
    case "movie":     arr=arr.filter(i=>i.type==="movie"); break;
    case "tv":        arr=arr.filter(i=>i.type==="tv"); break;
  }
  if(listQuery){
    arr=arr.filter(i=> i.title.toLowerCase().includes(listQuery)
      || (i.note||"").toLowerCase().includes(listQuery)
      || (i.genres||[]).join(" ").toLowerCase().includes(listQuery));
  }
  switch(sortMode){
    case "title":  arr.sort((a,b)=>a.title.localeCompare(b.title)); break;
    case "year":   arr.sort((a,b)=>(b.year||"").localeCompare(a.year||"")); break;
    case "rating": arr.sort((a,b)=>(parseFloat(b.rating)||0)-(parseFloat(a.rating)||0)); break;
    default:       arr.sort((a,b)=>b.added-a.added);
  }
  return arr;
}

const STATUS_CYCLE = {watchlist:"watching", watching:"seen", seen:"watchlist"};
const STATUS_LABEL = {watchlist:"◷ Watchlist", watching:"▶ Läuft gerade", seen:"✓ Gesehen"};

function render(){
  counts();
  const list = visible();
  if(!list.length){
    elList.innerHTML = `<div class="empty"><div class="big">${listQuery||activeFilter!=="all"?"Nichts gefunden.":"Noch nichts hier."}</div>
      <p>${listQuery||activeFilter!=="all"?"Andere Filter oder Suchbegriffe probieren.":"Such oben nach einem Film oder einer Serie — der Rest kommt automatisch."}</p></div>`;
    return;
  }
  elList.innerHTML = list.map(i=>{
    const k = uid(i);
    const poster = i.poster?`<img class="poster" src="${IMG}${i.poster}" alt="">`:`<div class="noposter">🎬</div>`;
    const isOpen = expanded.has(k);

    // Fortschritts-Anzeige bei Serien
    let progress = "";
    if(i.type==="tv" && i.seasons && i.seasons.length){
      const done = i.seasons.filter(s=>s.watched).length;
      const bits = [`Staffel ${done} von ${i.seasons.length}`];
      if(i.currentEp) bits.push("weiter bei "+esc(i.currentEp));
      progress = `<div class="progress">${bits.join(" · ")}</div>`;
    }

    // Detail-Panel
    let panel = `<div class="panel ${isOpen?"open":""}" data-panel="${k}">`;
    if(i.overview) panel += `<h4>Beschreibung</h4><div class="overview full">${esc(i.overview)}</div>`;
    if(i.type==="tv" && i.seasons && i.seasons.length){
      panel += `<h4>Staffeln</h4><div class="seasons">`;
      panel += i.seasons.map((s,idx)=>`<div class="season ${s.watched?"done":""}" data-season="${k}" data-idx="${idx}">
        <div class="box">${s.watched?"✓":""}</div><div class="sname">${esc(s.name)}</div>
        <div class="seps">${s.episodes?s.episodes+" Folgen":""}</div></div>`).join("");
      panel += `</div>`;
      panel += `<h4>Weiter bei</h4><div class="epfield">
        <input type="text" placeholder="z. B. S02E04" value="${esc(i.currentEp||"")}" data-ep="${k}">
        <label>aktuelle Folge</label></div>`;
    }
    panel += `<h4>Wo läuft's?</h4>`;
    if(i.providers && i.providers.length){
      panel += `<div class="providers">`+ i.providers.map(p=>`<span class="prov">
        ${p.logo?`<img src="${LOGO}${p.logo}" alt="">`:""}${esc(p.name)}</span>`).join("") +`</div>
        <div class="prov-src">Streaming-Daten von JustWatch (via TMDB), Region ${REGION}</div>`;
    } else {
      panel += `<div class="prov-empty">Kein Abo-Streaming für Region ${REGION} gefunden.</div>`;
    }
    panel += `<h4>Notiz</h4><textarea class="note" placeholder="z. B. Trailer auf YouTube gesehen, Empfehlung von …" data-note="${k}">${esc(i.note||"")}</textarea>`;
    panel += `</div>`;

    return `<div class="item">
      ${poster}
      <div class="body">
        <div class="top">
          <div class="title">${esc(i.title)} ${i.year?`<span class="year">${i.year}</span>`:""}</div>
          ${i.rating?`<span class="rating">★ ${i.rating}</span>`:""}
        </div>
        <div class="type">${i.type==="movie"?"Film":"Serie"}</div>
        ${i.genres&&i.genres.length?`<div class="genres">${i.genres.map(esc).join(" · ")}</div>`:""}
        ${progress}
        <div class="statusbar">
          <span class="pill ${i.status}" data-toggle="${k}">${STATUS_LABEL[i.status]}</span>
          <button class="iconbtn" data-expand="${k}">${isOpen?"Weniger":"Details"}</button>
          <button class="del" data-del="${k}" title="Entfernen">✕</button>
        </div>
        ${panel}
      </div>
    </div>`;
  }).join("");

  bindCardEvents();
}

function findByKey(k){ return items.find(i=>uid(i)===k); }

function bindCardEvents(){
  elList.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click",()=>{
    const it=findByKey(el.dataset.toggle); if(it){ it.status=STATUS_CYCLE[it.status]||"watchlist"; save(); }
  }));
  elList.querySelectorAll("[data-expand]").forEach(el=>el.addEventListener("click",()=>{
    const k=el.dataset.expand; expanded.has(k)?expanded.delete(k):expanded.add(k); render();
  }));
  elList.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{
    const k=el.dataset.del; items=items.filter(i=>uid(i)!==k); expanded.delete(k); save();
  }));
  elList.querySelectorAll("[data-season]").forEach(el=>el.addEventListener("click",()=>{
    const it=findByKey(el.dataset.season); if(!it) return;
    const s=it.seasons[+el.dataset.idx]; s.watched=!s.watched; save();
  }));
  elList.querySelectorAll("[data-note]").forEach(el=>el.addEventListener("input",()=>{
    const it=findByKey(el.dataset.note); if(it){ it.note=el.value; localStorage.setItem(STORE_KEY,JSON.stringify(items)); }
  }));
  elList.querySelectorAll("[data-ep]").forEach(el=>el.addEventListener("input",()=>{
    const it=findByKey(el.dataset.ep); if(it){ it.currentEp=el.value; localStorage.setItem(STORE_KEY,JSON.stringify(items)); }
  }));
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

render();
</script>
</body>
</html>
